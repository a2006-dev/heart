name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  go-check:
    name: Go (windows/amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: pc_client/go.sum
      - name: go vet
        working-directory: pc_client
        run: go vet ./...
      - name: go test
        working-directory: pc_client
        run: go test ./...
      - name: go build
        working-directory: pc_client
        run: go build -ldflags="-H windowsgui -s -w" -o heart_monitor_pc.exe .
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: heart_monitor_pc-windows
          path: pc_client/heart_monitor_pc.exe
          if-no-files-found: error
          retention-days: 30

  android-build:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Build release APK
        id: release_apk
        if: hashFiles('keystore.properties') != ''
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Locate APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          ls -la out
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: heart-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ go-check, android-build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: heart_monitor_pc-windows
          path: artifacts
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: heart-apk
          path: artifacts
      - name: List artifacts
        run: ls -la artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false

  android-unit-test:
    name: Android unit test
    runs-on: ubuntu-latest
    if: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: testDebugUnitTest
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace