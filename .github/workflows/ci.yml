name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m

jobs:
  go-check:
    name: Go (windows/amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: pc_client/go.sum
      - name: go vet
        working-directory: pc_client
        run: go vet ./...
      - name: go test
        working-directory: pc_client
        run: go test ./...
      - name: go build
        working-directory: pc_client
        run: go build -ldflags="-H windowsgui -s -w" -o heart_monitor_pc.exe .
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: heart_monitor_pc-windows
          path: pc_client/heart_monitor_pc.exe
          if-no-files-found: error
          retention-days: 30

  android-build:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 未配置，跳过 release 签名，仅构建 debug 包"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.p12
          {
            printf 'storeFile=release.p12\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          keytool -list -keystore release.p12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | tail -3
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Prepare debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | head -5
      - name: Collect APKs
        run: |
          mkdir -p out
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle | head -1)
          cp app/build/outputs/apk/release/*.apk "out/heart-${VERSION}-release.apk" 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk "out/heart-${VERSION}-debug.apk" 2>/dev/null || true
          ls -la out
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: heart-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ go-check, android-build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: heart_monitor_pc-windows
          path: artifacts
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: heart-apk
          path: artifacts
      - name: List artifacts
        run: ls -la artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## 心迹 ${{ github.ref_name }}

            自动构建产物：
            - `heart_monitor_pc.exe` — Windows 客户端（需放在有 adb.exe 的目录或加入 PATH）
            - `heart-*-release.apk` — Android 签名包，可直接覆盖安装
            - `heart-*-debug.apk` — 调试包，仅供测试

            安装提示：v3.2 起更换过签名密钥，从 v3.1 及更早版本升级需先卸载旧版。

  android-unit-test:
    name: Android unit test
    runs-on: ubuntu-latest
    if: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: testDebugUnitTest
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace